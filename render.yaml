# Render blueprint. Deploy with: New > Blueprint > point at this repo.
#
# Free-tier configuration. 512MB cannot hold demucs+torch, so separation is off and
# TTS is Piper (ONNX, no torch). The trade-off is that the original Korean dialogue
# is ducked under the dub rather than removed — voice-over style, not a clean dub.
#
# For the full pipeline, move to a 2GB+ plan and set: plan: standard,
# SEPARATE=1, TTS_BACKEND=polly, and build with --build-arg WITH_SEPARATION=1.
services:
  - type: web
    name: realtime-dub
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set these in the Render dashboard — never commit them.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: BEDROCK_MODEL_ID
        value: mistral.mistral-large-3-675b-instruct
      # Piper, not Polly: Polly has no Hindi male voice and falls back to Kokoro,
      # which would drag torch back in.
      - key: TTS_BACKEND
        value: piper
      - key: SEPARATE
        value: "0"
      - key: WHISPER_MODEL
        value: base
      - key: BUFFER_SECONDS
        value: "4"
      # Uploads only. Enabling this on a public host is arbitrary file disclosure.
      - key: ALLOW_LOCAL_PATH
        value: "0"
